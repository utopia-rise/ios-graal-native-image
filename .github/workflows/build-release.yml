name: Build iOS Graal JDK 25

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to attach to the downloadable workflow artifact.
        required: true
        default: 25.0.4-ios.1
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          version: 25.0.4
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release assets
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./scripts/build-release.sh

      - name: Verify release asset checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-graal-jdk-${{ inputs.release_version }}
          path: dist/
          if-no-files-found: error
